<svg xmlns="http://www.w3.org/2000/svg" width="1491" height="1055" viewBox="0 0 1491 1055" role="img" aria-labelledby="title desc">
  <title id="title">Jin requested machine choices, so naturally this illustration became aggressively non-illustrative</title>
  <desc id="desc">A humorous six-step engineering diagram showing an owner bundle becoming a normative runtime contract, machine artifacts, executable enforcement, and exact-head CI.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#475569"/></marker>
    <style>
      .title{font:700 56px Arial,sans-serif;fill:#0f172a}.purple{fill:#5630a8}.subtitle{font:500 25px Arial,sans-serif;fill:#1f2937}.box{fill:#fff;stroke-width:2;rx:18;filter:url(#shadow)}.head{font:700 25px Arial,sans-serif;fill:#fff}.body{font:500 18px Arial,sans-serif;fill:#172033}.small{font:600 16px Arial,sans-serif}.num{font:700 24px Arial,sans-serif;fill:#fff}.footer{font:800 45px Arial,sans-serif;fill:#fff}.footnote{font:600 20px Arial,sans-serif;fill:#bfe2ff}.stamp{font:800 23px Arial,sans-serif}.badge{font:800 22px Arial,sans-serif;fill:#5b21b6}.arrow{stroke:#475569;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1491" height="1055" fill="#fbfaf7"/>

  <g transform="translate(46 45) rotate(-8 90 90)">
    <rect x="8" y="15" width="170" height="150" rx="18" fill="#27272a"/>
    <rect x="20" y="45" width="145" height="95" rx="8" fill="#fff" stroke="#dc2626" stroke-width="8"/>
    <text x="92" y="73" text-anchor="middle" class="stamp" fill="#dc2626">NO LONGER</text>
    <text x="92" y="101" text-anchor="middle" class="stamp" fill="#dc2626">JUST</text>
    <text x="92" y="129" text-anchor="middle" class="stamp" fill="#dc2626">ILLUSTRATIVE</text>
    <rect x="58" y="-4" width="75" height="42" rx="20" fill="#18181b"/>
  </g>

  <text x="260" y="70" class="title">Jin requested machine choices.</text>
  <text x="260" y="130" class="title">So naturally this illustration became</text>
  <text x="260" y="194" class="title purple">aggressively non-illustrative.</text>
  <line x1="260" y1="213" x2="1085" y2="213" stroke="#6d3bbb" stroke-width="5"/>
  <text x="265" y="250" class="subtitle"><tspan fill="#5630a8" font-weight="700">PR #942</tspan> now contains the normative contract, the machine artifacts,</text>
  <text x="265" y="282" class="subtitle">the tests, and this diagram doing its absolute best to look dangerously authoritative.</text>

  <g transform="translate(1190 25)">
    <circle cx="115" cy="100" r="96" fill="#ede9fe" stroke="#5b21b6" stroke-width="8"/>
    <circle cx="115" cy="100" r="75" fill="#fff" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="115" y="83" text-anchor="middle" class="badge">AGGRESSIVELY</text>
    <text x="115" y="112" text-anchor="middle" class="badge">NORMATIVE</text>
    <text x="115" y="141" text-anchor="middle" class="small" fill="#5b21b6">NO AMBIGUITY LEFT</text>
    <path d="M75 190 L95 270 L125 225 L155 270 L160 190" fill="#6d28d9"/>
  </g>

  <g transform="translate(1035 220) rotate(5 120 55)">
    <rect width="245" height="100" rx="8" fill="#fff4c8" stroke="#a16207" stroke-width="2" filter="url(#shadow)"/>
    <text x="122" y="42" text-anchor="middle" font-family="Arial" font-size="22" font-style="italic" fill="#202020">Now with fewer</text>
    <text x="122" y="72" text-anchor="middle" font-family="Arial" font-size="22" font-style="italic" fill="#202020">illustrative feelings.</text>
  </g>

  <path class="arrow" d="M450 455 H500"/><path class="arrow" d="M950 455 H995"/><path class="arrow" d="M1190 570 V610"/><path class="arrow" d="M995 735 H950"/><path class="arrow" d="M500 735 H450"/>

  <g transform="translate(40 345)">
    <rect class="box" width="410" height="220" stroke="#3b82f6"/>
    <rect width="410" height="55" rx="18" fill="#1266cc"/><circle cx="38" cy="28" r="25" fill="#1d4ed8" stroke="#fff" stroke-width="3"/><text x="38" y="37" text-anchor="middle" class="num">1</text><text x="78" y="37" class="head">Owner bundle</text>
    <rect x="24" y="82" width="105" height="92" rx="8" fill="#c98d4a" stroke="#6b4423" stroke-width="3"/><path d="M24 110 L76 82 L129 110" fill="#dfad6a" stroke="#6b4423" stroke-width="2"/><rect x="49" y="122" width="58" height="35" fill="#f5e2c2" stroke="#6b4423"/><text x="78" y="145" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700">OWNER STUFF</text>
    <text x="155" y="92" class="body"><tspan x="155" dy="0">• #937 comment 5095866461</tspan><tspan x="155" dy="34">• Not vibes. Actual fields</tspan><tspan x="173" dy="25">and transitions.</tspan><tspan x="155" dy="38" fill="#1266cc" font-weight="700">• Input, not yet durable authority</tspan></text>
  </g>

  <g transform="translate(500 345)">
    <rect class="box" width="450" height="220" stroke="#f97316"/>
    <rect width="450" height="55" rx="18" fill="#f05a0b"/><circle cx="38" cy="28" r="25" fill="#c2410c" stroke="#fff" stroke-width="3"/><text x="38" y="37" text-anchor="middle" class="num">2</text><text x="78" y="37" class="head">AMEND</text>
    <rect x="28" y="82" width="105" height="110" rx="8" fill="#fff7df" stroke="#374151" stroke-width="3"/><text x="80" y="110" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">A1–A16</text><path d="M48 132 l8 8 15-18 M48 157 l8 8 15-18" stroke="#64748b" stroke-width="4" fill="none"/>
    <text x="160" y="94" class="body"><tspan x="160" dy="0">• A1–A16 name exact replacements</tspan><tspan x="160" dy="34">• Fields, enums, digests,</tspan><tspan x="178" dy="25">transitions, failures</tspan><tspan x="160" dy="38" fill="#ea580c" font-weight="700">• Human decision, explicitly scoped</tspan></text>
  </g>

  <g transform="translate(995 345)">
    <rect class="box" width="455" height="220" stroke="#8b5cf6"/>
    <rect width="455" height="55" rx="18" fill="#6d28d9"/><circle cx="38" cy="28" r="25" fill="#5b21b6" stroke="#fff" stroke-width="3"/><text x="38" y="37" text-anchor="middle" class="num">3</text><text x="78" y="37" class="head">Normative runtime spec</text>
    <rect x="30" y="82" width="95" height="112" rx="8" fill="#5b21b6" stroke="#2e1065" stroke-width="3"/><text x="78" y="127" text-anchor="middle" font-family="Arial" font-size="25" font-weight="800" fill="#fff">SPEC</text><text x="78" y="160" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#ddd6fe">v1</text>
    <text x="150" y="90" class="body"><tspan x="150" dy="0">• docs/specs/state-machine-</tspan><tspan x="168" dy="25">resolver-v1-runtime-architecture.md</tspan><tspan x="150" dy="36">• Every named choice is normative</tspan><tspan x="150" dy="36" fill="#6d28d9" font-weight="700">• Illustrative ambiguity has</tspan><tspan x="168" dy="25" fill="#6d28d9" font-weight="700">left the building</tspan></text>
  </g>

  <g transform="translate(995 610)">
    <rect class="box" width="455" height="220" stroke="#22c55e"/>
    <rect width="455" height="55" rx="18" fill="#0a9b52"/><circle cx="38" cy="28" r="25" fill="#047857" stroke="#fff" stroke-width="3"/><text x="38" y="37" text-anchor="middle" class="num">4</text><text x="78" y="37" class="head">Machine artifacts</text>
    <rect x="28" y="83" width="105" height="108" rx="5" fill="#64748b" stroke="#1f2937" stroke-width="3"/><rect x="43" y="104" width="75" height="32" fill="#94a3b8"/><rect x="48" y="144" width="65" height="34" fill="#fff"/><text x="80" y="166" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800">FACTS ONLY</text>
    <text x="158" y="91" class="body"><tspan x="158" dy="0">• contract.json + amendment-001.json</tspan><tspan x="158" dy="34">• 6 closed JSON Schemas</tspan><tspan x="158" dy="34">• 8 fixtures + golden digest vectors</tspan><tspan x="158" dy="34" fill="#078247" font-weight="700">• Durable machine authority lives here</tspan></text>
  </g>

  <g transform="translate(500 610)">
    <rect class="box" width="450" height="220" stroke="#06b6d4"/>
    <rect width="450" height="55" rx="18" fill="#0799aa"/><circle cx="38" cy="28" r="25" fill="#0e7490" stroke="#fff" stroke-width="3"/><text x="38" y="37" text-anchor="middle" class="num">5</text><text x="78" y="37" class="head">Executable enforcement</text>
    <circle cx="80" cy="116" r="45" fill="#94a3b8" stroke="#334155" stroke-width="3"/><rect x="45" y="143" width="75" height="50" rx="8" fill="#475569"/><text x="82" y="166" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="#fff">FAIL</text><text x="82" y="184" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="#fff">CLOSED</text>
    <text x="155" y="91" class="body"><tspan x="155" dy="0">• Deterministic validators</tspan><tspan x="155" dy="34">• Negative controls that fail closed</tspan><tspan x="155" dy="34">• Schema, fixture, digest, replay checks</tspan><tspan x="155" dy="34" fill="#087f8c" font-weight="700">• If it cannot fail, it is fan fiction</tspan></text>
  </g>

  <g transform="translate(40 610)">
    <rect class="box" width="410" height="220" stroke="#eab308"/>
    <rect width="410" height="55" rx="18" fill="#d99b00"/><circle cx="38" cy="28" r="25" fill="#a16207" stroke="#fff" stroke-width="3"/><text x="38" y="37" text-anchor="middle" class="num">6</text><text x="78" y="37" class="head">Exact-head CI</text>
    <rect x="25" y="94" width="115" height="95" rx="10" fill="#334155" stroke="#111827" stroke-width="3"/><rect x="48" y="111" width="70" height="42" rx="5" fill="#111827"/><text x="83" y="129" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#5eea4f">EXACT</text><text x="83" y="147" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#5eea4f">HEAD</text><circle cx="82" cy="82" r="10" fill="#f59e0b"/>
    <text x="162" y="92" class="body"><tspan x="162" dy="0">• Rust CI contract step</tspan><tspan x="162" dy="34">• Governance Boundary</tspan><tspan x="162" dy="34">• Factory attestation + secret scan</tspan><tspan x="162" dy="34" fill="#a16207" font-weight="700">• Evidence belongs to one exact commit</tspan></text>
  </g>

  <g transform="translate(255 855)">
    <rect width="990" height="105" rx="20" fill="#0f1f3a"/>
    <text x="495" y="56" text-anchor="middle" class="footer">★ THE MACHINE CONTRACT IS THE CONTRACT. ★</text>
    <text x="495" y="88" text-anchor="middle" class="footnote">This diagram explains it, resembles it, points at it, and still has absolutely no canonical authority.</text>
  </g>

  <g transform="translate(25 855) rotate(-3 105 82)"><rect width="205" height="150" rx="12" fill="#f6e6bd" stroke="#8b5e2b" stroke-width="3"/><text x="103" y="35" text-anchor="middle" font-family="Courier New" font-size="15" font-weight="700">LEGAL NOTE (PROBABLY):</text><text x="20" y="68" font-family="Courier New" font-size="14"><tspan x="20" dy="0">This diagram is not legal</tspan><tspan x="20" dy="22">advice. It is, however,</tspan><tspan x="20" dy="22">trying very hard.</tspan></text></g>
  <g transform="translate(1265 850)"><rect x="20" y="22" width="125" height="130" rx="15" fill="#fff" stroke="#444" stroke-width="3"/><path d="M145 55 C195 50 195 120 145 120" fill="none" stroke="#444" stroke-width="8"/><text x="82" y="68" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800"><tspan x="82" dy="0">RUNS ON</tspan><tspan x="82" dy="23">DETERMINISM</tspan><tspan x="82" dy="23">&amp; CAFFEINE</tspan></text><path d="M55 10 C40 -15 75 -15 60 -40 M90 10 C75 -15 110 -15 95 -40" stroke="#aaa" stroke-width="4" fill="none"/></g>

  <g transform="translate(405 980)"><rect width="730" height="55" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/><text x="25" y="34" font-family="Arial" font-size="19" font-weight="700" fill="#5b21b6">Diagram promoted from “helpful sketch” to “comically overqualified explainer”.</text><g transform="translate(585 9) rotate(-4 70 18)"><rect width="135" height="37" rx="4" fill="none" stroke="#6d28d9" stroke-width="4"/><text x="67" y="25" text-anchor="middle" font-family="Arial" font-size="15" font-weight="900" fill="#6d28d9">PROMOTION CONFIRMED</text></g></g>
</svg>